server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: asset-service-bases
          uri: ${ASSET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/bases/**

        - id: asset-service-equipment
          uri: ${ASSET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/equipment/**

        - id: asset-service-inventory
          uri: ${ASSET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**

        - id: transaction-service-purchases
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/purchases/**

        - id: transaction-service-transfers
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/transfers/**

        - id: transaction-service-assignments
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/assignments/**

        - id: transaction-service-expenditures
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/expenditures/**

        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/audit-logs/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
